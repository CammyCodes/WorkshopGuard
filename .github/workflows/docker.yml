name: Test and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly rebuild: fresh capa and YARA Forge rules

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fixtures (inert fake malware)
        run: sh tests/build_fixtures.sh

      - name: Build image
        run: docker build -t workshopguard:test .

      - name: Unit tests
        run: |
          docker run --rm --entrypoint sh -v "$PWD/tests:/app/tests:ro" -e CLAMAV_HOST= workshopguard:test \
            -c "pip install -q --user pytest && python -m pytest -q -p no:cacheprovider /app/tests"

      - name: Live self-test (real BO3 download, planted fake detection)
        run: docker run --rm -e GAMES=bo3 workshopguard:test selftest bo3 --no-notify

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/workshopguard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
